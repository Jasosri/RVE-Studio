[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RVE-Studio"
version = "1.0.0"
description = "RVE Studio: strain-energy homogenisation, verification and design of laminated-composite cellular cores"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Jasotharan Sriharan"}]
keywords = ["homogenisation", "honeycomb", "cellular core", "sandwich", "composite laminate", "RVE",
            "periodic boundary conditions", "finite element", "strain energy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: X11 Applications :: Qt",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "PySide6>=6.6"
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.4", "pytest-cov>=4", "pytest-github-actions-annotate-failures>=0.2", "ruff>=0.4", "pyinstaller>=6.0", "pyarrow>=14"]
gui = []   # PySide6 is already a core dependency; kept so that `pip install RVE-Studio[gui]` works

[project.scripts]
rvestudio = "rvestudio.cli:main"
rve-studio = "rvestudio.cli:main"

[project.gui-scripts]
rvestudio-gui = "rvestudio.gui:launch"

[project.urls]
Documentation = "https://github.com/Jasosri/RVE-Studio/tree/main/docs"
Source = "https://github.com/Jasosri/RVE-Studio"
"Source paper" = "https://doi.org/10.1016/j.engstruct.2023.117106"

[tool.setuptools.packages.find]
where = ["."]
include = ["rvestudio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
rvestudio = ["defaults/data/*.json", "defaults/plugins/*.py", "gui/assets/*.png", "gui/assets/*.ico", "docs/*.pdf"]
