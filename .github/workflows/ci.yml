name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (pyflakes errors)
        run: ruff check --select F --ignore F401,F403,F405,F841 rvestudio tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen   # the GUI smoke tests run headless
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Abaqus is not needed: the Abaqus workflow tests use tests/fake_abaqus.py.
      # Each failing test is also reported as an annotation on the run's summary page
      # (pytest-github-actions-annotate-failures), and the full output is kept as an artifact.
      - name: Tests (including the Qt GUI smoke tests)
        shell: bash
        run: |
          set -o pipefail
          pytest -rfE --tb=short --cov=rvestudio --cov-report=xml 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pytest-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-output.txt
      - name: Benchmark designs (the 84 reference values must be reproduced)
        run: python -c "from rvestudio.api import benchmark; r = benchmark(tolerance_pct=0.3); print(r['within_tolerance'], 'of', r['total']); assert r['passed']"
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml
